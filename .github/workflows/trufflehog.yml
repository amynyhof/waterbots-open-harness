# A third, independent secrets scan on every pull request (trufflehog), beside gitleaks and
# the repository's own scripts/scan-diff.mjs. Pinned to a fixed commit, as every action here is.
name: Trufflehog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@eafb8c5f6a06175141c27f17bcc17941853d0047 # v3.90.0
        with:
          path: ./
          # No base and no head, the maintainer's yes of 22 Nov 2026: the pinned action then reads a pull
          # request's own commits (its base and head commits) on a pull request, and the whole history on a
          # run started by hand. Given "main" and "HEAD" before, it read 0 chunks on every pull request.
          extra_args: --results=verified,unknown
