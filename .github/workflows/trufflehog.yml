# A third, independent secrets scan on every pull request (trufflehog), beside gitleaks and
# the repository's own scripts/scan-diff.mjs. Pinned to a fixed commit, as every action here is.
name: Trufflehog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@eafb8c5f6a06175141c27f17bcc17941853d0047 # v3.90.0
        with:
          path: ./
          # On a pull request, the commits between main and the pull request's head, as before. On a run
          # started by hand, both are empty, so the action scans the whole history (the maintainer's yes,
          # 22 Nov 2026). Given main for both, it stopped with "BASE and HEAD are the same".
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          extra_args: --results=verified,unknown
