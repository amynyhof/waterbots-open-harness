# The eligibility worksheet — the carbon pathway's section.
#
# WHAT THIS FILE IS. The tool definition contract, ruled 24 Sep 2026: one file
# per tool, holding the tool's rows, their states, what each takes, where a
# value comes from, and citations by card id. The site's worksheet, Phoebe's
# prompt generator, an outside Model Context Protocol (MCP) server and the
# grading rig are all meant to read this one file rather than four copies of it.
#
# ONE TOOL, TWO SECTIONS, ONE FILE EACH. Ruling R3 of 22 Sep 2026 made the
# eligibility worksheet one tool with a section per pack. This file is the
# carbon pathway's section; the water pathway's is its own file beside its own
# cards, `../../vwba-2.0/tool/eligibility-worksheet.yaml`. Both declare the same
# `tool.id` and differ in `section`. A reader that opens both has the whole
# tool; one that opens this has one pathway.
#
# NOTHING READS IT YET, and nothing in this pack is live. It is built ahead of
# its readers so the shape is settled before anything is wired to it, and
# `tool/README.md` stands as it is. Phoebe still says carbon eligibility is
# coming and not live.
#
# EVERY ROW CITES A CARD, NEVER A SOURCE. This pack has cards, so a row names
# the card that carries its words and the card file carries them: the tool file
# names the card, it never copies it. A route is always a route card's id.
#
# WHICH ROWS EXIST FOR A PROJECT. Ruling R9 as amended 24 Sep 2026 gave a row
# one optional ninth key, `applies`, read from the card's own "Applies to" line:
# the technology class or the version a row exists for. Absent means every
# project, which is how thirty of these thirty-six say it. The point is a
# division of labour — the tool file says which rows this project has, the row
# states say what is done and what is left, and the agent asks only what is
# left. What the line says about WHEN a row is asked or re-run stays on the
# card, because that is not the same question.
#
# THE GATE IS scripts/check-tool.mjs, which reads this file and the water one.
#
# YES AND NO ARE QUOTED. An outside reader may be a YAML 1.1 parser, which reads
# a bare yes as a boolean. The values here are words from a card, not booleans.

tool:
  id: eligibility-worksheet
  name: The eligibility worksheet
  purpose: >-
    Works out, one question at a time, whether a project can count a benefit on
    a pathway — and where it cannot yet, what would change that.

pack:
  key: gs-paa-v2.0
  # Equal to the pack README's own "**Version x.y.z.**" line; the gate holds the
  # two together, and check-cards already holds that line to the CHANGELOG head.
  version: 0.8.0

section:
  id: carbon
  name: The carbon pathway
  pathway: carbon

# The documents the cards in this section cite, by short id, each one held equal
