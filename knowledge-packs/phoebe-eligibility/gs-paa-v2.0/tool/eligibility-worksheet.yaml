# What this section posts to the project record. A pack's headline figure is
# Calvin's tool's output and the pin is Bridget's; neither belongs to this one.
# One verdict per pathway: a project may qualify here and not on the water
# pathway, or the other way round, and the two are never merged.
outputs:
  - id: pathway
    posts: Whether the carbon pathway is in play, from the applies rows.
    takes:
      kind: state
      of: pathway-state

  - id: version
    posts: Which version of the methodology the project is judged on, from card T4.
    takes:
      kind: choice
      of: version-flag

  - id: rows
    posts: Each requirement's state, with what that state must carry.
    takes:
      kind: state
      of: row-state

  - id: readiness
    posts: >-
      The readiness read for the carbon pathway: likely eligible when every row
      that applies is Met, likely not when any row is Blocked, not enough known
      yet for anything else.
    takes:
      kind: state
      of: readiness-read
