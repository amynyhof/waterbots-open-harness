# The project-context fields this tool reads BEFORE it asks anything. On this
# site that is the record Wellington collects; on the paid site it is the
# project context; through the MCP door it is whatever the caller already holds.
# Provenance says how a field came to be filled, and is the visit's own list.
record:
  - field: does
    asks: What the project does, in the visitor's own words.
    takes: { kind: text }
    provenance: [chat]
    note: Never typed on a form; only heard. It often settles T1 to T3 without a question.

  - field: name
    asks: What the project is called.
    takes: { kind: text }
    provenance: [typed, chat]

  - field: place
    asks: Where the project is — a country or a named place.
    takes: { kind: text }
    provenance: [typed, chat, pin]
    note: The host country decides several rows. The pin fills it only when the visitor has neither typed it nor said it.

  - field: type
    asks: Which of the cited project types this is.
    takes: { kind: choice }
    provenance: [chat]
    note: >-
      Ruled 23 Sep 2026 (item A16): a cited list of twenty-four types in
      knowledge-packs/product-shared/project-types.md, confirmed then logged.
      Not built. The live record still carries `kind`, which retires with it,
      and the applies cards say `kind` is a hint from the visitor and never the
      test's answer.

  - field: stage
    asks: How far along the project is.
    takes: { kind: choice }
    provenance: [chat]
    note: Ruled 23 Sep 2026 (item A16). Not built. A planned project is normal.

  - field: pin
    asks: The one basin this visit is about.
    takes: { kind: text }
    provenance: [pin]
    note: Bridget's tool writes it. This tool reads it and never sets it.

# Every closed list of values this section uses, in one place. A row's
# `takes.of` and an output's `takes.of` name one of them.
states:
  # The five of the guide-not-gate ruling, 23 Sep 2026 (item A18), the same five
  # the water section uses. A miss is sorted before anything is ruled out, and
  # only the cards say which rows can ever be Blocked.
  row-state:
    - id: unchecked
      label: Not yet checked
      carries: nothing
      colour: --state-locked

    - id: met
      label: Met
      carries: one sentence on what settled it
      colour: --state-approved

    - id: fixable
      label: Fixable
      carries: the route card's id, so the console draws the route with its citation; never prose alone
      colour: --state-pending

    - id: unknown
      label: Unknown
      carries: what to find out, in a sentence; and where the gap is a baseline or a survey, the save-and-design offer
      colour: --state-pending

    - id: blocked
      label: Blocked
      carries: the card's own reason, cited
      # INTERIM, and recorded as one. The brand book's §2.5 has no "stopped"
      # value that is not an error, and coral is refused here; the pending
      # colour stands with the word "Blocked" until the maintainer rules on
      # pixels. Her ruling of 24 Sep 2026: the colours stay as they are until
      # build-order step 3.
      colour: --state-pending

  # Whether the pathway is in play at all. Never a verdict on the project and
  # never a count — the applies cards say so themselves, and there is no
  # "three of four".
  pathway-state:
    - id: unchecked
      label: Not yet checked
      carries: nothing
      # NOT RULED, and left empty rather than invented: a colour is a thing the
      # maintainer approves on pixels. Her ruling of 24 Sep 2026: empty until
      # build-order step 3.
      colour: null

    - id: applies
      label: Applies
      carries: nothing
      colour: null

    - id: does-not-apply
      label: Does not apply
      carries: which kind of no it is — fixable with a cited route, unknown, or blocked — and that the other pathway is separate
      colour: null

  # Which version of the methodology the project is judged on. Card T4 sets it,
  # and it changes what some rows ask for. Not a verdict and not a state of the
  # project; a sorting.
  version-flag:
    - id: new
      label: New project
      carries: nothing
      colour: null

    - id: transitioning
      label: Transitioning project
      carries: where the Paris-alignment design change stands, and when the current crediting period ends
      colour: null

    - id: unknown
      label: Not known yet
      carries: the one fact that would settle it — a Gold Standard registration under the 2021 version — and that the project is treated as new meanwhile
      colour: null

  # Which projects a row exists for — the values a row's optional `applies` key
  # may name, ruling R9 as amended 24 Sep 2026. It is not a state and is never
  # drawn: it sorts rows before the conversation starts, so that the tool file
  # says which rows this project has, the row states say what is done and what
  # is left, and the agent asks only what is left.
  #
  # THE FOUR CLASSES ARE CARD T3'S, in the words that card uses. The version
  # flags are card T4's. Every value is read from a card's "Applies to" line and
  # the gate holds it there.
  applies-to:
    - id: all
      label: Every project on this pathway
      # NEVER WRITTEN ON A ROW. Leaving the key out is how a row says it, and
      # two ways of saying one thing is what drifts. The gate refuses it.
    - id: hwt
      label: Household treatment
    - id: iwt
      label: Institutional treatment
    - id: cwt
      label: Community treatment
    - id: cws
      label: Community supply
    - id: transitioning
      label: A transitioning project
      # DECLARED, NOT USED TODAY. No card limits a row to one version: where a
      # card's line names a transitioning project it is saying when the row is
      # re-run, which is the card's business. The value is here so that a card
      # that does limit a row has somewhere to land.
    - id: new
      label: A new project

  # The read for the pathway, drawn from the row states and never from prose.
  # "Likely" is the honest word: nothing on this site verifies anything.
  readiness-read:
    - id: likely-eligible
      label: Likely eligible
      carries: nothing beyond the rows it was drawn from
      colour: null

    - id: likely-not
      label: Likely not
      carries: the blocked row's own reason
      colour: null

    - id: not-enough-known
      label: Not enough known yet
      carries: the list of rows still open, each with its route or its question
      colour: null

# One entry per row, in the card files' own order: the four "does this apply"
# questions, then the thirty-two eligibility cards — the methodology's own gate
# (M1–M17), then the Paris-alignment framework (P1–P2), then the rules for every
# Gold Standard project (G1–G13).
#
# `asked` is the phase on the navigation where the row is acted on, the
# phase-tags ruling of 23 Sep 2026, read from each card's Phase line. On this
# site Phoebe asks Eligibility rows only; every other row is shown once, grouped
# by phase with the seat that helps there, and is never counted against a
# planned project.
#
# `fixable` is the card's own "Can it be fixed?" line, first word. The four
# applies cards carry no such line; they sort a no under "If the answer is no",
# and their values are read from there. Every one of them names a Blocked case
# or, for T4, no fail at all.
#
# `applies` is the optional ninth key, and only six rows carry one: M2, M3, M4,
# M8, M9 and M16, the rows a class limits. Every other row exists for every
# project and says so by carrying no key at all.
#
# `routes` names route cards by id, and only where the card itself names one.
# Fourteen rows name none. Most of those describe a fix that is simply doing the
# thing — draw the boundary, get the permit, name the goal — and need no route
# card. Three describe a fix that a route card would carry and none does: T1's
# change of pump, M2's change of drive, and M14's justified sub-national area.
# Each of those three says so in a comment, because an empty list for a missing
# route card and an empty list for "nothing to route" are different facts.
rows:
  - id: T1
    title: Safe drinking water from a technology that gives off little or nothing
    # Blocked only where the activity does not supply drinking water at all. The
    # card names a fix for a pump on its own fossil-fuel engine, but no route card
    # carries that fix, so this row names none: a route is a card id or nothing.
    asked: eligibility
    takes:
      kind: state
      of: pathway-state
    from:
      - record: does
      - conversation
      - documents: the project’s own description of what it supplies and how it is powered
    fixable: "depends"
    routes: []
    cite:
      card: applies/T1

  - id: T2
    title: Today, people boil, or go without
    # No Fixable case: the card sorts a no into Blocked or Unknown only, so there is
    # no route to name.
    asked: eligibility
    takes:
      kind: state
      of: pathway-state
    from:
      - record: does
      - conversation
      - documents: the baseline survey, or the household questionnaire on how people get and treat their water today
    fixable: "depends"
    routes: []
    cite:
      card: applies/T2

  - id: T3
    title: One of four kinds of technology
    # The answer also sets the technology class that the eligibility cards’ "Applies
    # to" lines read. That fact belongs to the card, which this row cites.
    asked: eligibility
    takes:
      kind: state
      of: pathway-state
    from:
      - record: does
      - conversation
      - documents: the project design document’s statement of where the water is treated or produced, and for whom
    fixable: "depends"
    routes: []
    cite:
      card: applies/T3

  - id: T4
    title: Which version the project is judged on
    # Not yes-or-no: it sorts the project into a version. Nothing about it is ever
    # Blocked — the card says "I don’t know" is Unknown and not a fail.
    asked: eligibility
    takes:
      kind: choice
      of: version-flag
    from:
      - conversation
      - documents: the Gold Standard registration record for the project, and its certification documents where it has any
    fixable: "yes"
    routes: []
    cite:
      card: applies/T4

  - id: M1
    title: A technology the method names
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - record: does
      - conversation
      - documents: the technology specification naming the treatment or supply technology used
    fixable: "depends"
    routes: [R-2]
    cite:
      card: eligibility/M1

  - id: M2
    title: No pump on its own fossil-fuel engine
    # The card’s fix is a change of drive. No route card carries it, so none is named.
    asked: eligibility
    applies: [cws]
    takes:
      kind: state
      of: row-state
    from:
      - record: does
      - conversation
      - documents: the pump specification, naming its drive
    fixable: "depends"
    routes: []
    cite:
      card: eligibility/M2

  - id: M3
    title: The treatment technology is shown to work
    asked: plan
    applies: [hwt, iwt]
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the product’s laboratory report, its listing under the WHO evaluation scheme, or the national notice
    fixable: "yes"
    routes: [R-2]
    cite:
      card: eligibility/M3

  - id: M4
    title: The water at the collection point is safe
    asked: plan
    applies: [cwt, cws]
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the water-quality test results for the collection point
    fixable: "yes"
    routes: [R-3]
    cite:
      card: eligibility/M4

  - id: M5
    title: The people served boil today, or go without
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - record: does
      - conversation
      - documents: the baseline survey’s findings on how people get and treat their water today
    fixable: "depends"
    routes: [R-1, R-4]
    cite:
      card: eligibility/M5

  - id: M6
    title: Suppressed demand only for small and micro-scale projects
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the project design document’s statement of scale, and what it claims as suppressed demand
    fixable: "depends"
    routes: []
    cite:
      card: eligibility/M6

  - id: M7
    title: Suppressed demand comes with basic service
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the service-level evidence for the water supplied, and the network’s test results where there is a network
    fixable: "yes"
    routes: [R-4]
    cite:
      card: eligibility/M7

  - id: M8
    title: Collected water is within reach
    asked: partners
    applies: [cwt, cws]
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the service-area map, and the distance or time evidence for the people counted
    fixable: "yes"
    routes: [R-5]
    cite:
      card: eligibility/M8

  - id: M9
    title: A restored system was really out of action
    asked: eligibility
    applies: [cwt, cws]
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the outage history of the system being restored, with dates and evidence
    fixable: "depends"
    routes: [R-6]
    cite:
      card: eligibility/M9

  - id: M10
    title: The technology's life is known, and replacement is planned
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the technology’s specification or guarantee, and the replacement plan
    fixable: "yes"
    routes: [R-7]
    cite:
      card: eligibility/M10

  - id: M11
    title: Nothing is counted twice
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the unit database, the registry searches, and the double-counting declaration
    fixable: "yes"
    routes: [R-8]
    cite:
      card: eligibility/M11

  - id: M12
    title: No law already requires it, and the host country has not excluded it
    # Blocked where the host country has excluded the activity type: only the country
    # can change that.
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - record: place
      - conversation
      - documents: the review of the host country’s law, and of its list of excluded activity types
    fixable: "depends"
    routes: [R-9]
    cite:
      card: eligibility/M12

  - id: M13
    title: Additional, by the positive list or by analysis
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: "the additionality demonstration: the positive-list check, or the financial analysis"
    fixable: "depends"
    routes: [R-10, R-11]
    cite:
      card: eligibility/M13

  - id: M14
    title: Not yet common practice
    # The card’s fix is a justified sub-national area or a change of design. No route
    # card carries it, so none is named.
    asked: quantify
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the common-practice analysis for the area claimed
    fixable: "depends"
    routes: []
    cite:
      card: eligibility/M14

  - id: M15
    title: No lock-in
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the lock-in assessment, or the maker’s evidence of the technology’s life
    fixable: "yes"
    routes: [R-12]
    cite:
      card: eligibility/M15

  - id: M16
    title: Groundwater is drawn within what the aquifer can give
    asked: partners
    applies: [cws]
    takes:
      kind: state
      of: row-state
    from:
      - record: place
      - conversation
      - documents: the groundwater assessment, or the abstraction permit
    fixable: "yes"
    routes: [R-13]
    cite:
      card: eligibility/M16

  - id: M17
    title: The running rules are in the design
    asked: to-remain-eligible
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the design’s regulatory summary, maintenance plan and awareness campaign
    fixable: "yes"
    routes: [R-6]
    cite:
      card: eligibility/M17

  - id: P1
    title: The right version of the method
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the project’s certification record, and the Paris-alignment design change where it is transitioning
    fixable: "depends"
    routes: [R-19]
    cite:
      card: eligibility/P1

  - id: P2
    title: A community-services activity
    asked: eligibility
    takes:
      kind: state
      of: row-state
    from:
      - record: does
      - conversation
      - documents: the project design document’s statement of who the water serves
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/P2

  - id: G1
    title: A real activity on the ground, with a boundary
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the project boundary and the site descriptions
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/G1

  - id: G2
    title: The project keeps the host country's law
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - record: place
      - conversation
      - documents: the permits, and the review of which national rules touch safe-water supply
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/G2

  - id: G3
    title: Everyone involved is named and in good standing
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the registration and good-standing documents for every party involved
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/G3

  - id: G4
    title: Ownership of the credits is clear and agreed
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the ownership statement, the consent forms and the contracts
    fixable: "yes"
    routes: [R-8]
    cite:
      card: eligibility/G4

  - id: G5
    title: The other rights the project rests on are not in dispute
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the land, water and access rights the project rests on
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/G5

  - id: G6
    title: Aid money is declared, and none of it buys the credits
    # Blocked where aid is given on condition that the credits go to the donor country.
    asked: partners
    takes:
      kind: state
      of: row-state
    from:
      - record: place
      - conversation
      - documents: the funding agreements, and the conditions attached to any aid money
    fixable: "depends"
    routes: []
    cite:
      card: eligibility/G6

  - id: G7
    title: Three Sustainable Development Goals, one of them climate
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the project design document’s Sustainable Development Goal section and its indicators
    fixable: "yes"
    routes: []
    cite:
      card: eligibility/G7

  - id: G8
    title: The safeguarding assessment is done and answered
    asked: plan
    takes:
      kind: state
      of: row-state
    from:
      - conversation
      - documents: the completed safeguarding assessment and its mitigation plan
    fixable: "yes"
    routes: [R-16]
    cite:
      card: eligibility/G8

  - id: G9
    title: The people affected were consulted, in two rounds, before the start
    asked: partners
    takes:
      kind: state
