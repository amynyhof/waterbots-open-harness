      - documents: the records of the two consultation rounds, with their dates
    fixable: "yes"
    routes: [R-14]
    cite:
      card: eligibility/G9

  - id: G10
    title: A way to raise a grievance, for the life of the project
    asked: partners
    takes:
      kind: state
